name: Live LeadLoop access smoke
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/live-security-smoke.yml
      - scripts/smoke.mjs
  workflow_dispatch:
jobs:
  anonymous-public-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test production public pages and anonymous CRM API access
        env:
          SMOKE_BASE_URL: https://leadloop-crm-staging.vercel.app
        run: node scripts/smoke.mjs
