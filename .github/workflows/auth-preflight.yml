name: Live Signup API Diagnostics
on:
  push:
    branches: [fix/signup-diagnostics]
    paths:
      - scripts/auth-preflight.mjs
      - .github/workflows/auth-preflight.yml
  workflow_dispatch:
jobs:
  check-signup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check auth router and validate rejected invalid signup
        env:
          SMOKE_BASE_URL: https://leadloop-crm-staging.vercel.app
        run: node scripts/auth-preflight.mjs
