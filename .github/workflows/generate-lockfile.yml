name: Generate dependency lockfile
on:
  push:
    branches: [fix/ci-lint-and-repo-cleanup]
permissions:
  contents: write
jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[skip lockfile]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Resolve lockfile without install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Add reproducible npm lockfile [skip lockfile]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
